name: Playwright Tests        # 1. Nama workflow

on:                           # 2. Kapan di-trigger
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:                         # 3. Job yang dijalankan

  code_analyze:
    name: Code Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Script
        run: echo "code_analyze"

  test:                       # Nama job
    timeout-minutes: 60        # 4. Batas waktu maksimal
    runs-on: ubuntu-latest    # 5. OS runner
    needs : [code_analyze]
    container:                # 6. Docker container
      image: divo164/personal_project:base
    steps:                    # 7. Langkah-langkah
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Run Playwright tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30